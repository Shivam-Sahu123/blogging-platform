
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post | Blogger</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="editor-page">

    <header class="editor-navbar">
        <a href="dashboard.html" class="brand">
            <span class="brand-symbol">B</span>
            Blogger
        </a>

        <span class="editor-status" id="editorStatus">
            New article
        </span>

        <div class="editor-actions">
            <button type="button" class="preview-btn" id="previewButton">
                Preview
            </button>
            <button type="button" class="draft-btn" id="draftButton">
                Save draft
            </button>
            <button type="button" class="publish-btn" id="publishButton">
                Publish
            </button>
        </div>
    </header>

    <main class="editor-container">

        <div class="editor-main">

            <span class="eyebrow">CREATE SOMETHING NEW</span>

            <input
                type="text"
                id="postTitle"
                class="title-input"
                placeholder="Give your story a title..."
                maxlength="150"
            >

            <div class="editor-toolbar">
                <button type="button" data-command="bold"><b>B</b></button>
                <button type="button" data-command="italic"><i>I</i></button>
                <button type="button" data-command="underline"><u>U</u></button>
                <button type="button" data-command="formatBlock" data-value="h2">H2</button>
                <button type="button" data-command="insertUnorderedList">☷</button>
                <button type="button" data-command="formatBlock" data-value="blockquote">❝</button>
            </div>

            <div
                id="postContent"
                class="content-editor"
                contenteditable="true"
                data-placeholder="Start writing your story here..."
            ></div>

        </div>

        <aside class="editor-settings">

            <h3>Post Settings</h3>

            <label for="postCategory">Category</label>
            <select id="postCategory">
                <option value="Technology">Technology</option>
                <option value="Lifestyle">Lifestyle</option>
                <option value="Education">Education</option>
                <option value="Travel">Travel</option>
                <option value="Personal">Personal</option>
                <option value="Other">Other</option>
            </select>

            <div class="settings-note">
                <span>💡</span>
                <p>
                    A good title and organized content
                    help readers understand your story.
                </p>
            </div>

            <a href="dashboard.html" class="back-dashboard">
                ← Back to dashboard
            </a>

        </aside>

    </main>

    <div class="preview-overlay" id="previewOverlay" hidden>
        <div class="preview-window">
            <button type="button" id="closePreview" class="close-preview">
                ✕
            </button>
            <span class="eyebrow">ARTICLE PREVIEW</span>
            <h1 id="previewTitle"></h1>
            <p class="preview-category" id="previewCategory"></p>
            <article id="previewContent"></article>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
